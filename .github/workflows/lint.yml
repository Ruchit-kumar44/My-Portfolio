name: Builds succeeds on PR

on:
    pull_request:
        branches:
            - main

jobs: 
    build:
        name: Build and Lint Project
        runs-on: ubuntu-latest 

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: setup Nodejs
            uses: actions/setup-node@v4
            with: 
                node-version: '24'
                cache: 'npm'
        
          - name: Install Dependencies
            run: npm ci
          
          - name: Lint the Project
            run: npm lint

          - name: Check the Project
            run: prettier --check '**/*.{js,jsx,ts,tsx,json,md}'